<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A101B">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Apprendre League of Legends par la récupération en mémoire.">
<title>Rift Rappel</title>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0A101B; --bg2:#0E1624; --panel:#131C2E; --panel2:#19243B; --line:#26344F; --line2:#33445F;
  --text:#E8EDF6; --muted:#8F9CB6; --faint:#5E6C86;
  --gold:#D9B45B; --gold-ink:#1A1306; --teal:#43C6B4; --blue:#4DA3F0; --violet:#A08CF2;
  --red:#E4665F; --good:#4CC38A; --warn:#E3A948;
  --map:#0D1822; --map2:#12222E; --river:#1D4A62; --lane:#3B4B60;
  /* une couleur par thème (icônes, pastilles) et par type de dégâts */
  --c-voc:#5FA4F4; --c-map:#43C6B4; --c-lane:#7CCB6B; --c-champ:#EF6F64; --c-item:#E8955A;
  --c-eco:#E8C552; --c-obj:#A08CF2; --c-rune:#5FD0E8; --c-mu:#EE7FAE; --c-macro:#9AA8FF;
  --phys:#E8955A; --magic:#A08CF2;
  --tier:var(--teal);
  --r:10px;
  --display:"Chakra Petch", "Rajdhani", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.5;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(67,198,180,.08), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(217,180,91,.06), transparent 60%),
    url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2748%27 viewBox=%270 0 56 48%27%3E%3Cpath d=%27M14 0l14 8v16l-14 8L0 24V8zM42 24l14 8v16M42 24L28 32v16%27 fill=%27none%27 stroke=%27%23ffffff%27 stroke-opacity=%27.025%27/%3E%3C/svg%3E"),
    var(--bg);
  min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,16,27,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.brand svg{flex:none}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{padding:6px 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:14px}
.nav button[aria-current="true"]{color:var(--text);background:var(--panel2)}
.nav button:hover{color:var(--text)}

/* ---------- éléments communs ---------- */
.eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.section{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:19px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:9px;font-weight:700;font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;font-size:14px;background:var(--gold);color:var(--gold-ink);transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:7px 12px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted)}
.pill.tier{color:var(--tier);border-color:color-mix(in srgb,var(--tier) 45%,transparent);background:color-mix(in srgb,var(--tier) 10%,transparent)}
.code{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;padding:3px 6px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tier);border-radius:99px;transition:width .4s}
.num{font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line2)}
.pips i.on{background:var(--gold)}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;display:flex;flex-direction:column}
.ob-in{max-width:620px;width:100%;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:flex;flex-direction:column;gap:22px;flex:1}
.ob-steps{display:flex;gap:5px}
.ob-steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.ob-steps i.on{background:var(--gold)}
.ob h1{font-size:clamp(28px,6vw,40px)}
.ob .lead{font-size:17px;color:var(--muted);max-width:56ch}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.choice{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);transition:border-color .12s, background .12s}
.choice:hover{border-color:var(--line2);background:var(--panel2)}
.choice[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--panel))}
.choice b{font-weight:700;font-size:16px}
.choice span{color:var(--muted);font-size:14px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rank{padding:12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase;font-size:14px;display:flex;align-items:center;gap:9px}
.rank i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg);flex:none}
.rank[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--panel))}
.input{width:100%;padding:13px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:17px}
.ob-foot{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.loop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.loop div{padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.loop div b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin-bottom:4px}
.loop div:nth-child(3){border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.loop div:nth-child(3) b{color:var(--gold)}
.loop p{font-size:14px;color:var(--muted)}
@media (max-width:560px){.loop{grid-template-columns:1fr}.loop div{display:grid;grid-template-columns:36px 1fr;column-gap:12px;row-gap:0}.loop .lic{grid-row:span 2}}
.tiercard{border-radius:14px;padding:22px;border:1px solid color-mix(in srgb,var(--tier) 50%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--tier) 14%,var(--panel)),var(--panel) 60%)}
.tiercard h2{font-size:30px;color:var(--tier)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:9px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;transform:rotate(45deg);background:var(--tier)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.compare{grid-template-columns:1fr}}

/* ---------- accueil ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-top:26px}
.hello h1{font-size:clamp(24px,5vw,32px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.hero{margin-top:14px;border-radius:14px;padding:20px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%,var(--panel)),var(--panel) 65%);display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:22px}
.hero p{color:var(--muted);margin-top:4px;max-width:46ch}
.path{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.step .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);position:relative;z-index:1}
.step.done .dot{background:var(--tier);color:#07131a;border-color:var(--tier)}
.step.cur .dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.step.lock{opacity:.5}
.step:not(:last-child)::after{content:"";position:absolute;left:16.5px;top:44px;bottom:-10px;width:1px;background:var(--line2)}
.step h3{font-size:16px}
.step p{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{text-align:left;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:border-color .12s,background .12s}
.tile:hover{border-color:var(--line2);background:var(--panel2)}
.tile .row{justify-content:space-between}
.tile h3{font-size:16px}
.tile p{font-size:13px;color:var(--muted)}
.why{margin-top:30px;padding:16px 18px;border-radius:var(--r);border:1px dashed var(--line2);color:var(--muted);font-size:14px}
.why b{color:var(--text)}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:12px;padding-top:22px}
.qhead .bar{flex:1}
.qx{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.qx:hover{color:var(--text)}
.qcard{margin-top:20px;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(20px,4.2vw,26px);font-weight:600;line-height:1.25;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:15.5px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--line2);background:var(--panel2)}
.opt .k{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--panel2);color:var(--muted)}
.opt.sel{border-color:var(--gold)}
.opt.sel .k{background:var(--gold);color:var(--gold-ink)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel))}
.opt.ok .k{background:var(--good);color:#06150d}
.opt.ko{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,var(--panel))}
.opt.ko .k{background:var(--red);color:#1d0605}
.opt[disabled]{cursor:default}
.conf{display:flex;flex-direction:column;gap:8px}
.conf .row button{flex:1;min-width:110px}
.hint{padding:12px 14px;border-radius:9px;background:color-mix(in srgb,var(--teal) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);font-size:14px}
.fb{padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:8px}
.fb h3{font-size:18px}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--red)}
.fb .meta{font-size:13.5px;color:var(--warn)}
.timer{height:4px;border-radius:4px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.timer.low i{background:var(--red)}
.qfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ---------- fiche ---------- */
.lesson{margin-top:22px}
.lesson ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:12px}
.lesson li{padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:16px}
.stage{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px}
.stage span{padding:5px 10px;border-radius:7px;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--panel2);color:var(--faint)}
.stage span.on{color:var(--gold-ink);background:var(--gold)}

/* ---------- résultats ---------- */
.score{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.recap{display:flex;flex-direction:column;gap:6px}
.recap div{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.recap i{width:10px;height:10px;border-radius:50%;margin-top:5px}

/* ---------- mises en situation ---------- */
.scn{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;margin-top:18px;align-items:start}
@media (max-width:640px){.scn{grid-template-columns:1fr}}
.mapbox{border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--map);max-width:100%}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}
.look{padding:12px 14px;border-radius:9px;border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);background:color-mix(in srgb,var(--teal) 8%,var(--panel));font-size:14px}
.look ul{margin:6px 0 0;padding-left:18px}
/* choix d’objets : composition adverse */
.comp{border-radius:12px;border:1px solid var(--line2);background:var(--panel);overflow:hidden}
.comp-me{padding:12px 14px;border-left:3px solid var(--gold);background:var(--panel2)}
.comp-me .row{gap:8px;align-items:center;flex-wrap:wrap}
.comp-me b{font-family:var(--display);font-size:16px}
.comp-me .gold{color:var(--gold);font-family:var(--display);font-weight:700;margin-left:auto}
.comp-me p,.foe p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.comp-h{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding:10px 14px 4px}
.foe{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 14px;border-top:1px solid var(--line);align-items:start}
.foe .code{text-align:center}
.foe-n{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dmg{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tags span{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--text)}
.tally{padding:9px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--panel))}
.verdict{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.v2{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.v1{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.v0{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.optx{font-size:14px;color:var(--muted);margin-top:6px}
.opt.long{grid-template-columns:28px 1fr}

/* ---------- lexique & profil ---------- */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gloss div{padding:12px 14px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.gloss b{font-family:var(--display);letter-spacing:.03em;display:block}
.gloss span{font-size:14px;color:var(--muted)}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:9px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.rise{animation:rise .25s ease-out}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:20px}.nav button{padding:6px 8px;font-size:13px}}
.emb{flex:none;display:block}
.tile-rank{display:flex;gap:12px;align-items:center}
.rk{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.step h3 .rk{margin-left:6px;font-size:12px}
.lpline{display:flex;gap:10px;align-items:center;font-size:14px;padding-top:6px;border-top:1px solid var(--line)}
.up{color:var(--good)} .down{color:var(--red)}
.lpres{display:flex;flex-direction:column;gap:10px}
.lpres>div{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.lpres span{display:block;font-size:13.5px}
.rankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.rankcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:14px 8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.rankcell:hover{border-color:var(--line2)}
.rankcell b{font-size:14px}
.rankcell span{font-size:12.5px;color:var(--muted);font-family:var(--display)}
.rankcell .faint{color:var(--faint);font-size:11.5px}
.acct{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:7px;background:var(--panel2);font-size:13px;font-weight:600}
.insights{display:flex;flex-direction:column;gap:10px}
.ins{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.ins .tag{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap;margin-top:2px}
.ins.weak .tag{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.ins.strong .tag{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.ins b{font-size:15px}
.ins p{font-size:13.5px;color:var(--muted)}
.faint{color:var(--faint)}
.err{color:var(--red);font-size:14px}
select.input{appearance:auto}

<script>
/* ============================================================
   CONTENU — Rift Rappel
   Format question : Q(catégorie, difficulté 1-4, énoncé,
     [bonne réponse, faux1, faux2, faux3], explication, indice)
   La bonne réponse est toujours écrite en premier ; l'ordre est
   mélangé à l'affichage. Difficulté : 1 découverte, 2 bases,
   3 confirmé, 4 expert.
   ============================================================ */
const CATS = [
  { id:"voc",  name:"Vocabulaire",        code:"VOC", blurb:"Le jargon qu’on entend en partie et dans le chat." },
  { id:"map",  name:"La carte",           code:"MAP", blurb:"Lanes, jungle, buissons, tourelles, vision." },
  { id:"lane", name:"Lanes & rôles",      code:"LAN", blurb:"Top, jungle, mid, ADC, support : qui fait quoi." },
  { id:"champ",name:"Champions & sorts",  code:"CHP", blurb:"Passifs, sorts, ultimes qui changent un combat." },
  { id:"item", name:"Objets",             code:"OBJ", blurb:"Bottes, objets de support, anti-soin, défense." },
  { id:"eco",  name:"Économie",           code:"ECO", blurb:"Or, last hit, primes, plaques." },
  { id:"obj",  name:"Objectifs",          code:"OBJ", blurb:"Dragons, Nashor, Héraut, larves." },
  { id:"rune", name:"Runes",              code:"RUN", blurb:"Arbres, runes clés, pages adaptées." },
  { id:"mu",   name:"Matchups",           code:"MUP", blurb:"Lire un affrontement et jouer autour." },
  { id:"macro",name:"Macro",              code:"MAC", blurb:"Rotations, gestion des vagues, décisions d’équipe." }
];
CATS.find(c=>c.id==="obj").code="OBT";

/* Ordre du parcours guidé pour les nouveaux joueurs */
const PATH = ["voc","map","lane","champ","item","eco","obj","rune","mu","macro"];

const QS = [];
let _qid = 0;
function Q(c,d,q,o,x,h){ QS.push({id:c+"-"+(++_qid), c, d, q, o, x, h:h||""}); }

/* ---------- VOCABULAIRE ---------- */
Q("voc",1,"Dans le tableau des scores, le « CS » compte…",["Les sbires et monstres que tu as achevés","Les sbires et monstres que tu as touchés","Tes kills et assistances cumulés","Les balises que tu as posées et détruites"],"Seul le coup fatal compte. Toucher un sbire sans l’achever ne rapporte rien, ni en CS ni en or.","Seul le dernier coup compte.");
Q("voc",1,"Quelle est la différence entre « gank » et « roam » ?",["Roamer, c’est quitter sa lane ; ganker, c’est attaquer une lane par surprise","Le gank est réservé au jungler, le roam au support","Le gank vise un champion, le roam vise une tourelle","Aucune, ce sont deux synonymes selon les régions"],"Un mid qui roam peut ganker le bot. Le jungler gank sans « roamer » puisqu’il n’a pas de lane.","L’un décrit un déplacement, l’autre une attaque.");
Q("voc",2,"Ton support « peel ». Concrètement, il…",["Utilise ses contrôles sur ceux qui attaquent ses carries","Utilise ses contrôles pour lancer le combat","Pose de la vision autour de son équipe","Se place devant pour prendre les tirs de tourelle"],"Peel est défensif : on retire la menace de son carry. Lancer le combat, c’est « engage ».","Défensif ou offensif ?");
Q("voc",2,"« Kiter » un champion de mêlée, c’est…",["Glisser des déplacements entre tes attaques pour rester hors de portée","Reculer sans attaquer jusqu’à ce qu’il abandonne","Attaquer sans bouger pour maximiser tes dégâts","Garder ton Flash pour le moment où il te rattrape"],"On attaque, on bouge, on attaque. Reculer sans frapper, c’est simplement fuir.","Attaquer ET bouger.");
Q("voc",2,"« Zoner » un adversaire signifie…",["L’empêcher d’approcher d’une zone par la menace que tu représentes","Le repousser hors de sa lane avec des projections","Poser des balises dans sa moitié de jungle","Le suivre sur la carte pour connaître sa position"],"Un ADC zoné ne peut pas approcher de ses sbires : il perd de l’or sans même se battre.","Pas besoin de le toucher.");
Q("voc",3,"Quelle description correspond à un « slow push » ?",["Tu tues surtout les sbires à distance adverses et ta vague grossit peu à peu","Tu nettoies toute la vague au plus vite avec tes sorts de zone","Tu ne donnes que les derniers coups pour garder la vague devant ta tourelle","Tu laisses la vague ennemie détruire la tienne pour qu’elle revienne"],"En enlevant d’abord les sbires à distance ennemis, ta vague survit et accumule les renforts : elle arrive énorme sur la tourelle.","Ta vague doit survivre.");
Q("voc",3,"Après un crash, on dit que la vague « rebondit ». Pourquoi ?",["La tourelle détruit ta vague, puis la vague ennemie suivante revient pousser vers toi","Tes sbires survivants font demi-tour vers ta tourelle","La vague ennemie change de lane après le crash","Les sbires ennemis deviennent plus forts à chaque crash"],"C’est ce rebond qui rend le cheater recall rentable : pendant ton absence, la vague revient vers ta tourelle au lieu de mourir.","Qui reste sur la lane après le crash ?");
Q("voc",3,"Avoir la « prio » en mid signifie…",["Pouvoir quitter ta lane en premier sans perdre de sbires","Avoir plus de kills que ton adversaire direct","Avoir atteint le niveau 6 avant lui","Avoir plus d’or que ton adversaire direct"],"La prio dépend de l’état de la vague, pas du score. On peut être derrière en kills et avoir la prio.","Pense à la vague, pas au score.");
Q("voc",3,"Un « pick » (ou « catch ») désigne…",["Tuer un ennemi isolé avant un combat ou un objectif","Choisir son champion en premier lors de la draft","Voler un objectif au Châtiment","Récupérer le buff d’un allié qui vient de mourir"],"Un pick crée un 5 contre 4 : la fenêtre idéale pour prendre un objectif.","Avant l’objectif…");
Q("voc",4,"Pourquoi le « cheater recall » coûte-t-il si peu ?",["Ta vague crashée occupe la tourelle ennemie pendant que tu achètes","Le rappel est plus court après avoir poussé une vague","Tu reçois l’or des sbires tués par ta vague pendant ton absence","L’ennemi ne peut pas savoir que tu es parti"],"Ton adversaire doit rester last-hit sous sa tourelle pendant que tu achètes. Tu reviens à temps pour la vague qui rebondit.","Qui est occupé pendant ton absence ?");
Q("voc",4,"« Flip » un objectif, c’est…",["Gagner le combat lancé par l’ennemi sur son objectif pour le prendre","Échanger un dragon contre une tourelle ailleurs sur la carte","Voler l’objectif au Châtiment sans engager de combat","Abandonner l’objectif pour éviter un combat perdu"],"L’équipe qui fait l’objectif perd des PV sur le monstre : c’est une fenêtre pour la retourner.","L’objectif change de camp.");
Q("voc",4,"Le « setup » d’un objectif consiste à…",["Pousser les vagues proches et prendre la vision 45 à 60 s avant son apparition","Désigner qui utilisera le Châtiment","Attendre que l’ennemi commence l’objectif pour le punir","Placer toute l’équipe dans la fosse au moment de l’apparition"],"Le combat pour un objectif se gagne souvent avant l’apparition : vagues, vision, position.","Avant l’apparition.");

/* ---------- LA CARTE ---------- */
Q("map",1,"Tu es dans un buisson. Qui peut te voir ?",["Les ennemis qui ont de la vision dans ce buisson","Tous les ennemis proches : le buisson ne cache qu’à distance","Seulement les tourelles ennemies","Personne, même si une balise ennemie y est posée"],"Il faut une présence ou une balise dans le buisson pour voir à l’intérieur. D’où les balises de contrôle dans les buissons clés.","La vision, pas la distance.");
Q("map",2,"Combien de balises de contrôle un joueur peut-il avoir posées en même temps ?",["1","2","3","Aucune limite"],"Si tu en poses une deuxième, la première disparaît. Tu peux en porter plusieurs dans ton inventaire.","Très peu.");
Q("map",2,"La lentille d’oracle (trinket rouge)…",["Révèle et désactive les balises et pièges invisibles autour de toi","Révèle les champions ennemis cachés dans les buissons","Donne une vision lointaine en un point de la carte","Pose une balise invisible pendant un temps limité"],"Elle ne révèle pas les champions. La vision lointaine, c’est la longue-vue (bleue).","Elle nettoie.");
Q("map",2,"Tu attaques un champion ennemi au milieu de ses sbires. Que font-ils ?",["Ils te ciblent en priorité","Ils continuent de frapper tes sbires","Ils te ciblent seulement si tu utilises un sort","Ils ciblent ton sbire le plus proche de toi"],"C’est l’aggro des sbires : échanger au milieu de la vague ennemie te coûte des PV cachés.","Ils protègent leur champion.");
Q("map",2,"Une tourelle tire plusieurs fois de suite sur le même champion. Ses dégâts…",["Augmentent à chaque tir consécutif","Restent identiques à chaque tir","Diminuent pour laisser le temps de fuir","Doublent seulement après 14 minutes"],"C’est pourquoi un dive doit être court, ou partagé entre plusieurs champions.","Elle « chauffe ».");
Q("map",2,"Un inhibiteur détruit réapparaît après…",["5 minutes","3 minutes","8 minutes","Il ne réapparaît jamais"],"Pendant ce temps, les super-sbires de l’équipe adverse poussent cette lane.","Quelques minutes.");
Q("map",2,"Tu tues un jungler ennemi qui porte le buff rouge. Le buff…",["Est transféré à celui qui l’a tué","Disparaît définitivement","Retourne à son camp d’origine","Est partagé entre les ennemis proches"],"Voler un buff sur un champion est un double gain : tu l’obtiens, il le perd.","Il change de propriétaire.");
Q("map",3,"Au minimum, combien de tourelles faut-il détruire avant de pouvoir attaquer le Nexus ?",["5","3","7","11"],"Une lane entière (3 tourelles), puis l’inhibiteur, puis les 2 tourelles du Nexus.","Une lane + le Nexus.");
Q("map",3,"Après avoir été tué, un buff rouge ou bleu réapparaît au bout de…",["5 minutes","2 minutes 30","3 minutes","7 minutes"],"Noter l’heure des buffs adverses permet d’anticiper le trajet du jungler.","Comme l’inhibiteur.");
Q("map",3,"En plein dive, la tourelle te cible. Comment la faire changer de cible ?",["Un allié frappe un champion ennemi à portée de cette tourelle","Tu arrêtes d’attaquer pendant deux secondes","Tu utilises un sort plutôt qu’une attaque de base","Un sbire allié entre dans la portée de la tourelle"],"La tourelle bascule sur le champion qui agresse un de ses champions. Ne plus attaquer ne suffit pas : elle garde sa cible.","Qui agresse sous la tourelle ?");
Q("map",3,"Pourquoi une balise de contrôle dans un buisson de rivière plutôt qu’une balise invisible ?",["Elle reste en place et refuse durablement la vision ennemie ici","Elle offre un rayon de vision bien plus large","Elle est invisible pour l’ennemi","Elle rapporte de l’or à chaque ennemi repéré"],"La balise invisible expire. La balise de contrôle reste et désactive les balises invisibles adverses dans la zone.","Durée et refus de vision.");
Q("map",4,"Le jungler ennemi a commencé par son buff rouge (côté bot) et fait un full clear. Où finit-il probablement ?",["Côté top, à la fin de son chemin de camps","Côté bot, en train de refaire son buff rouge","Dans ta jungle, en train de voler ton buff bleu","En base, juste après son dernier camp"],"Un full clear traverse sa jungle d’un côté à l’autre. Le buff rouge ne réapparaîtra pas avant 5 minutes : le côté top est la zone à surveiller.","Il traverse sa jungle.");

/* ---------- LANES & RÔLES ---------- */
Q("lane",1,"Qui prend les sbires en bot lane ?",["L’ADC ; le support seulement si un sbire va être perdu","Le support et l’ADC, à parts égales","Le support, pour faire évoluer son objet plus vite","Celui des deux qui a le plus de PV"],"Chaque sbire pris par le support retarde les objets de l’ADC, qui dépend de l’or bien plus que lui.","Qui dépend le plus des objets ?");
Q("lane",1,"Pourquoi les joueurs top prennent-ils souvent Téléportation ?",["Pour rejoindre vite l’action depuis une lane longue et isolée","Parce que le rappel est plus long en top","Pour se téléporter sur un sbire et esquiver les ganks","Parce qu’Embrasement est peu utile au corps à corps"],"Le top est loin des dragons et de la plupart des combats. La Téléportation compense cet isolement.","Distance.");
Q("lane",2,"Le jungler ennemi est vu en haut de la carte à 3:20. Tu es bot. Qu’est-ce que ça change ?",["Tu peux jouer plus agressif : aucun gank bot n’est possible dans l’immédiat","Rien, cette information ne concerne que ton top","Tu peux pousser sous la tourelle ennemie sans limite de temps","Tu dois aller aider ton top à deux"],"Une info sur le jungler a une durée de vie : elle vaut une trentaine de secondes, pas plus.","Où ne peut-il PAS être ?");
Q("lane",2,"Pourquoi le mid est-il la lane qui roam le plus ?",["Lane courte, avec un accès direct aux deux moitiés de rivière","Le mid reçoit plus de sbires par vague","Le mid n’a pas de tourelle intérieure","Le mid gagne l’or passif plus vite"],"Proximité avec les deux rivières et les deux objectifs : le mid influence toute la carte.","Géographie.");

const LADDER = [["Fer","#8a7f78"],["Bronze","#b07a52"],["Argent","#a9b8c6"],["Or","#d9b45b"],["Platine","#4fbfae"],["Émeraude","#3fbf7a"],["Diamant","#7c95f5"],["Maître","#b774e6"],["Grand Maître","#e0605a"],["Challenger","#f4d98a"]];

function rankOf(r){
  if(r>=3400) return {i:9, name:"Challenger", div:"", lp:r-3400, apex:true};
  if(r>=3100) return {i:8, name:"Grand Maître", div:"", lp:r-3100, apex:true};
  if(r>=2800) return {i:7, name:"Maître", div:"", lp:r-2800, apex:true};
  const i=Math.floor(r/400); return {i, name:LADDER[i][0], div:DIVS[Math.floor((r%400)/100)], lp:r%100, apex:false};

const rankLabel = r => { const k=rankOf(r); return k.name+(k.div?" "+k.div:""); };
function catR(cat){ if(!S.rank) S.rank={}; if(!S.rank[cat]) S.rank[cat]={r:SEED[S.profile?S.profile.tier:1], n:0, peak:0}; return S.rank[cat]; }

function updateRank(cat, qR, score){
  const c=catR(cat), before=c.r, K = c.n<PLACEMENTS ? 120 : 50;
  const E = 1/(1+Math.pow(10,(qR-c.r)/400));
  let d = Math.round(K*(score-E)); if(score>=1 && d<2) d=2;
  c.r = Math.max(0, c.r+d); c.n++; if(c.n>=PLACEMENTS) c.peak=Math.max(c.peak||0,c.r);
  let note="";
  if(c.n===PLACEMENTS) note=`Placement terminé en ${catOf(cat).name} : ${rankLabel(c.r)}`;

function weightedItems(len){
  const w=S.riot.data.weights||{}, now=Date.now();
  const cats=CATS.map(c=>c.id), tot=cats.reduce((a,c)=>a+(w[c]||1),0);
  let alloc=cats.map(c=>{const n=(w[c]||1)/tot*len; return {c, k:Math.floor(n), f:n-Math.floor(n)};});
  let left=len-alloc.reduce((a,x)=>a+x.k,0);
  alloc.slice().sort((a,b)=>b.f-a.f).forEach(x=>{ if(left>0){x.k++;left--;} });
  let out=[];
  for(const a of alloc){
    if(!a.k) continue;
    const pool=eligibleCat(a.c);
    const due=pool.filter(q=>{const c=S.cards[q.id];return c&&c.due<=now;});
    const fresh=shuffle(pool.filter(q=>!S.cards[q.id]));
    const rest=shuffle(pool.filter(q=>S.cards[q.id]&&S.cards[q.id].due>now));
    out=out.concat(due.concat(fresh,rest).slice(0,a.k));
  }
  return shuffle(out);
}
function buildSession(cat, mode){
  const t=T(), pool=eligible(cat), now=Date.now();
  let items;
  if(!cat && mode!=="review" && S.riot && S.riot.data){ items = weightedItems(t.len); }
  else if(mode==="review"){
    items = pool.filter(q=>{const c=S.cards[q.id];return c&&c.due<=now;}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,t.len);
  } else {
    const due = pool.filter(q=>{const c=S.cards[q.id];return c&&c.due<=now;}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
    let fresh = shuffle(pool.filter(q=>!S.cards[q.id]));
    if(t.full) fresh.sort((a,b)=>a.d-b.d);
    const rest = shuffle(pool.filter(q=>S.cards[q.id] && S.cards[q.id].due>now));
    items = due.slice(0,Math.ceil(t.len/2)).concat(fresh);
    items = items.concat(rest).slice(0,t.len);
    items = t.full ? items : shuffle(items);
  }
  return { cat, mode, items: items.map(q=>q.id), i:0, results:[], retried:{}, sel:null, phase:"ask", hint:false, order:null, xp:0, t0:0 };
}
function startQuiz(cat, mode){
  const q = buildSession(cat, mode);
  if(!q.items.length){ toast(mode==="review"?"Aucune révision due pour l’instant.":"Pas de question disponible ici."); return; }
  const t=T();
  if(cat && mode!=="review" && !S.lessons[cat] && (t.lesson==="auto"||t.lesson==="first")){ go("lesson",{lesson:{cat, then:q}}); return; }
  go("quiz",{quiz:q});
}
function optionOrder(q){
  const t=T(); let idx=[0,1,2,3];
  if(t.opts===3) idx=[0].concat(shuffle([1,2,3]).slice(0,2));
  return shuffle(idx);
}
function grade(qz, chosen, conf){
  const q = qById(qz.items[qz.i]), ok = chosen===0;
  const c = S.cards[q.id] || {box:0, n:0, ok:0};
  c.n++; if(ok) c.ok++;
  if(ok){
    if(conf==="sure" && !qz.hint) c.box = Math.min(5, c.box+1);
    else if(conf==="guess") c.box = 1;
    else c.box = Math.max(1, c.box);
  } else c.box = 0;
  c.due = Date.now() + INTERVALS[c.box]*DAY;
  S.cards[q.id]=c;
  const gain = ok ? (conf==="sure"?15:10) : 2;
  S.xp += gain; qz.xp += gain;
  touchDay(); S.daily.count++;
  const isRetry = !!qz.retried[q.id+"#"+qz.i];
  qz.rk = null;
  if(!isRetry){
    let sc = ok ? (conf==="sure"?1:conf==="hesit"?.85:.5) : 0;
    if(ok && qz.hint) sc=Math.min(sc,.7);
    const rk = updateRank(q.c, Q_RATING[q.d], sc);
    qz.rk = rk; qz.lp = qz.lp||{};
    if(!qz.lp[q.c]) qz.lp[q.c]={from:rk.before, n0:rk.n-1};
    qz.lp[q.c].to = rk.after; qz.lp[q.c].n = rk.n;
    if(rk.note) { qz.notes=(qz.notes||[]); qz.notes.push(rk.note); setTimeout(()=>toast(rk.note),50); }
  }
  qz.results.push({id:q.id, ok, conf, retry:isRetry});
  if(!ok && T().retry && !Object.keys(qz.retried).some(k=>k.startsWith(q.id+"#"))){
    qz.items.push(q.id); qz.retried[q.id+"#"+(qz.items.length-1)] = true;
  }
  qz.phase="feedback"; qz.sel=chosen; qz.conf=conf; qz.ok=ok;
  save();
}

  if(t.timer && qz.phase==="ask"){

const TOWERS=[[12,64],[12,38],[34,66],[42,58],[36,88],[62,88],[16,80],[22,78],[20,84]];
function miniMap(ms){
  const C={blue:"#4DA3F0",red:"#E4665F",gold:"#D9B45B",warn:"#E3A948",violet:"#A08CF2",text:"#E8EDF6",map:"#0D1822",map2:"#12222E",river:"#1D4A62",lane:"#3B4B60",faint:"#5E6C86"};

    let s="";

    else if(m.k==="ally") s=`<circle cx="${m.x}" cy="${m.y}" r="2.8" fill="${C["blue"]}" stroke="#0b1a2a" stroke-width=".6"/>`;
    else if(m.k==="enemy") s=`<circle cx="${m.x}" cy="${m.y}" r="2.8" fill="${C["red"]}" stroke="#2a0b0b" stroke-width=".6"/>`;

    else if(m.k==="obj") s=`<circle cx="${m.x}" cy="${m.y}" r="4.2" fill="none" stroke="${C["violet"]}" stroke-width=".9"/>`;
    const lx = m.x>70 ? m.x-4.5 : m.x+4.5, anchor = m.x>70?"end":"start";

const REGIONS=[["EUW1","Europe Ouest (EUW)"],["EUN1","Europe Nord & Est (EUNE)"],["NA1","Amérique du Nord (NA)"],["KR","Corée (KR)"],["BR1","Brésil (BR)"],["LA1","Amérique latine Nord (LAN)"],["LA2","Amérique latine Sud (LAS)"],["OC1","Océanie (OCE)"],["TR1","Turquie (TR)"],["RU","Russie (RU)"],["JP1","Japon (JP)"],["ME1","Moyen-Orient (ME)"],["SG2","Asie du Sud-Est (SEA)"],["TW2","Taïwan (TW)"],["VN2","Vietnam (VN)"]];
async function fetchRiot(params){
  let res, j;
  try{ res = await fetch("/api/profile?"+new URLSearchParams(params)); }
  catch(e){ throw new Error("Impossible de joindre le serveur de l’app. La connexion au compte ne fonctionne que sur la version hébergée."); }
  try{ j = await res.json(); }
  catch(e){ throw new Error("Le serveur de l’app ne répond pas. La connexion au compte ne fonctionne que sur la version hébergée."); }
  if(!res.ok) throw new Error(j.error || "Erreur du serveur.");
  return j;
}
async function connectRiot(where, demo){
  const st = where==="ob" ? V.ob.data : V.link;
  if(!demo){
    st.riotId = (document.getElementById(where+"-riot")||{}).value || st.riotId || "";
    st.platform = (document.getElementById(where+"-platform")||{}).value || st.platform || "EUW1";
    if(!/^.{3,16}#[A-Za-z0-9]{2,5}$/u.test(st.riotId.trim())){ st.err="Écris ton Riot ID complet, avec le #TAG (ex : Pseudo#EUW)."; return render(); }
  }
  st.loading=true; st.err=null; render();
  try{
    const data = await fetchRiot(demo?{demo:1}:{riotId:st.riotId.trim(), platform:st.platform});
    st.riot=data; if(demo){ st.riotId=data.riotId; st.platform=data.platform; }
    if(where==="ob"){ st.name=data.gameName; if(data.role) st.role=data.role; st.exp="ranked"; st.rank=data.rank?data.rank.tierFr:"Non classé"; delete st.tier; }
  }catch(e){ st.err=e.message; }
  st.loading=false; render();
}
function linkRiot(data, meta, reseedAll){
  S.riot = {data, riotId:meta.riotId||data.riotId, platform:meta.platform||data.platform, demo:!!data.demo};
  for(const c of CATS.map(x=>x.id)){
    const cur = S.rank && S.rank[c];
    if(reseedAll || !cur || !cur.n){ if(!S.rank) S.rank={}; S.rank[c]={r:(data.seed||{})[c] ?? SEED[S.profile?S.profile.tier:1], n:0, peak:0}; }
  }
  if(S.profile && data.role && (!S.profile.role || S.profile.role==="Je ne sais pas encore")) S.profile.role=data.role;
  save();
}

  if(!S.riot) return;

    const data = await fetchRiot(S.riot.demo?{demo:1}:{riotId:S.riot.riotId, platform:S.riot.platform, refresh:1});

  csm:[4.5,5.0,5.5,6.0,6.5,7.0,7.3,7.8,8.0,8.3], vpmSup:[1.2,1.4,1.6,1.8,2.0,2.2,2.4,2.6,2.7,2.8], vpm:[.40,.50,.55,.60,.70,.80,.90,1.0,1.05,1.1],
  cwSup:[1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.0,4.5,4.5], cw:[.3,.5,.7,.9,1.1,1.3,1.5,1.7,1.8,2.0], deaths:[8,7.5,7,6.5,6,5.5,5,4.8,4.5,4.3],
  early:[2.5,2.2,2.0,1.8,1.6,1.4,1.2,1.1,1.0,.9], kp:[.45,.47,.49,.51,.53,.55,.57,.58,.59,.60], objp:[.45,.48,.51,.54,.57,.60,.63,.66,.68,.70]
};
const METRIC_CATS = { csm:{eco:1,lane:.6}, vpm:{map:1,macro:.3}, cw:{map:.7,item:.2}, deaths:{mu:.6,lane:.5,macro:.4}, early:{lane:1,mu:.8}, kp:{macro:.7}, objp:{obj:1,macro:.6}, antiheal:{item:1,mu:.4} };
const METRICS = [
  {k:"csm", label:"CS par minute", cat:"eco", fmt:v=>v.toFixed(1).replace(".",",")},
  {k:"vpm", label:"Score de vision par minute", cat:"map", fmt:v=>v.toFixed(2).replace(".",",")},
  {k:"cw", label:"Balises de contrôle par partie", cat:"map", fmt:v=>v.toFixed(1).replace(".",",")},
  {k:"deaths", label:"Morts par partie", cat:"mu", lower:true, fmt:v=>v.toFixed(1).replace(".",",")},
  {k:"early", label:"Morts avant 14 min", cat:"lane", lower:true, fmt:v=>v.toFixed(1).replace(".",",")},
  {k:"kp", label:"Participation aux kills", cat:"macro", fmt:v=>Math.round(v*100)+" %"},
  {k:"objp", label:"Participation aux objectifs", cat:"obj", fmt:v=>Math.round(v*100)+" %"},
  {k:"antiheal", label:"Anti-soin face aux soigneurs", cat:"item"}
];
const FAKE_CHAMPS = {Top:["Darius","Garen","Sett","Ornn","Fiora","Camille"],Jungle:["Lee Sin","Vi","Graves","Amumu","Kayn","Viego"],Mid:["Ahri","Orianna","Syndra","Yasuo","Viktor","Akali"],ADC:["Jinx","Caitlyn","Ezreal","Kai’Sa","Jhin","Ashe"],Support:["Thresh","Lulu","Nautilus","Leona","Nami","Karma"]};
function hashStr(str){ let h=2166136261; for(const ch of str){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ let x=(seed%2147483646)+1; return ()=>((x=x*16807%2147483647)-1)/2147483646; }
function fakeProfile(riotId){
  const [gameName, tag="EUW"] = riotId.split("#").map(x=>x.trim());
  const rnd = seeded(hashStr(riotId.toLowerCase()));
  const pickW = w => { let t=rnd()*w.reduce((a,b)=>a+b,0); for(let i=0;i<w.length;i++){ t-=w[i]; if(t<0) return i; } return w.length-1; };
  const ti = pickW([8,18,22,20,14,9,6,3]);
  const LAD = ["Fer","Bronze","Argent","Or","Platine","Émeraude","Diamant","Maître"];
  const division = ti>=7 ? "" : ["IV","III","II","I"][Math.floor(rnd()*4)];
  const lp = ti>=7 ? Math.floor(rnd()*250) : Math.floor(rnd()*100);
  const role = ["Top","Jungle","Mid","ADC","Support"][Math.floor(rnd()*5)];
  const sup = role==="Support", jgl = role==="Jungle";
  const target = {
    csm: BENCH.csm[ti]-(jgl?.8:0), vpm:(sup?BENCH.vpmSup:BENCH.vpm)[ti]+(jgl?.1:0), cw:(sup?BENCH.cwSup:BENCH.cw)[ti],
    deaths: BENCH.deaths[ti]+(sup?.5:0), early: BENCH.early[ti], kp: BENCH.kp[ti]+(sup||jgl?.08:0), objp: BENCH.objp[ti]
  };
  const lower = {deaths:true, early:true};
  const keys = Object.keys(target);
  const factor = {}; keys.forEach(k=>factor[k]=0.68+rnd()*0.62);
  // au moins deux vrais points faibles, pour que le profil soit parlant
  const weak = keys.filter(k=>factor[k]<0.9 && !(k==="csm"&&sup));
  for(const k of keys.filter(k=>!(k==="csm"&&sup)).sort(()=>rnd()-.5)){ if(weak.length>=2) break; if(!weak.includes(k)){ factor[k]=0.7+rnd()*0.12; weak.push(k); } }
  const values = {}; keys.forEach(k=>values[k] = lower[k] ? target[k]/factor[k] : target[k]*factor[k]);
  values.kp=Math.min(values.kp,.85); values.objp=Math.min(values.objp,.9);
  const ahGames = 3+Math.floor(rnd()*6), ahMissing = Math.floor(ahGames*rnd());
  const ratio = {}; keys.forEach(k=>{ if(k==="csm"&&sup) return; ratio[k] = lower[k] ? target[k]/values[k] : values[k]/target[k]; });
  ratio.antiheal = (ahGames-ahMissing)/ahGames/0.5;
  const cats = CATS.map(c=>c.id);
  const weights = Object.fromEntries(cats.map(c=>[c,1])), score = Object.fromEntries(cats.map(c=>[c,0]));
  for(const [k,r] of Object.entries(ratio)){ const d=Math.max(0,Math.min(1,1-r)), g=Math.max(0,Math.min(.5,r-1));
    for(const [c,w] of Object.entries(METRIC_CATS[k])){ weights[c]+=2.5*d*w; score[c]+=(g-d*1.5)*w; } }
  cats.forEach(c=>weights[c]=Math.round(Math.min(weights[c],4)*100)/100);
  const base = ti>=7 ? 2800+Math.min(lp,299) : ti*400+["IV","III","II","I"].indexOf(division)*100+lp;
  const seed = Object.fromEntries(cats.map(c=>[c, Math.max(0, Math.round(base+Math.max(-1,Math.min(.5,score[c]))*300))]));
  const insights=[];
  for(const m of METRICS){ const r=ratio[m.k]; if(r==null) continue;
    const kind = r<0.9 ? "weak" : r>=1.15 ? "strong" : null; if(!kind) continue;
    insights.push({key:m.k, kind, cat:m.cat, title:m.label, detail:"", score: kind==="weak"?1-r:r-1}); }
  insights.sort((a,b)=>a.kind===b.kind? b.score-a.score : a.kind==="weak"?-1:1);
  const pool = FAKE_CHAMPS[role].slice().sort(()=>rnd()-.5);
  const split=[8,5,4,3], wins=Math.round(20*(0.42+rnd()*0.2));
  const champions = pool.slice(0,4).map((n,i)=>({name:n, games:split[i], wins:Math.round(split[i]*(0.35+rnd()*0.35)), kda:1.6+rnd()*2}));
  const others = FAKE_CHAMPS[role].filter(n=>n!==champions[0].name);
  const matchups = [{champ:champions[0].name, vs:others[Math.floor(rnd()*others.length)], games:3, losses:2+Math.floor(rnd()*2)}];
  return { riotId:`${gameName}#${tag}`, gameName, platform:"EUW1", level:60+Math.floor(rnd()*400), iconId:null,
    rank:{queue:"Solo/Duo", tierIndex:ti, tierFr:LAD[ti], division, lp, wins:40+Math.floor(rnd()*80), losses:40+Math.floor(rnd()*80)},
    games:20, winrate:wins/20, role, values, targets:target, antiheal:{games:ahGames, missing:ahMissing}, ratio,
    insights, weights, seed, champions, matchups, fetchedAt:new Date().toISOString(), demo:true };
}
function metricRatio(r, m){
  if(r.ratio && r.ratio[m.k]!=null) return r.ratio[m.k];
  if(m.k==="antiheal") return null;
  const v=(r.values||{})[m.k], t=(r.targets||{})[m.k]; if(v==null||t==null) return null;
  return m.lower ? t/Math.max(v,.1) : v/Math.max(t,.01);
}
function accountStrip(r){
  const rk = r.rank ? `${r.rank.tierFr}${r.rank.division?" "+r.rank.division:""} · ${r.rank.lp} LP` : "Non classé";
  const col = r.rank ? LADDER[Math.min(r.rank.tierIndex,9)][1] : "#5E6C86";
  return `<div class="acctstrip">
    <div class="acct-id"><span class="rankdot" style="background:${col}"></span><div><b>${esc(r.riotId)}</b><span class="muted">${esc(rk)}${r.role?" · "+esc(r.role):""} · ${Math.round((r.winrate||0)*100)} % de victoires sur ${r.games} parties</span></div></div>
    <div class="chips">${(r.champions||[]).slice(0,4).map(c=>`<span class="chip">${esc(c.name)} <span class="num muted">${c.games}</span></span>`).join("")}${r.demo?`<span class="pill">Données d’exemple</span>`:""}</div>
  </div>`;
}
function overview(r){
  const tiles = METRICS.map(m=>{
    const sup = r.role==="Support";
    if(m.k==="csm" && sup) return `<div class="mtile na"><span class="mlabel">${icon(METRIC_IC[m.k],15)}${m.label}</span><b class="mval">—</b><span class="mref">Pas concerné en support</span></div>`;
    let val, ref;
    if(m.k==="antiheal"){ const a=r.antiheal||{games:0,missing:0}; val=`${a.games-a.missing}/${a.games}`; ref=`parties avec anti-soin, repère : au moins la moitié`; }
    else { const v=(r.values||{})[m.k], t=(r.targets||{})[m.k]; if(v==null) return ""; val=m.fmt(v); ref=`repère ${m.lower?"sous ":""}${m.fmt(t)}`; }
    const ra = metricRatio(r,m), st = ra==null ? "ok" : ra<0.9 ? "weak" : ra>=1.15 ? "strong" : "ok";
    const lab = {weak:"À travailler", ok:"Dans la moyenne", strong:"Point fort"}[st];
    return `<button class="mtile ${st}" data-a="cat" data-v="${m.cat}" aria-label="${esc(m.label)} : ${esc(val)}, ${lab}. Travailler ${esc(catOf(m.cat).name)}">
      <span class="mlabel">${icon(METRIC_IC[m.k],15)}${m.label}</span><b class="mval num">${val}</b><span class="mref">${ref}</span>
      <span class="mfoot"><span class="mstate">${lab}</span><span class="faint">${esc(catOf(m.cat).name)} →</span></span></button>`;
  }).join("");
  const mu = (r.matchups||[])[0];
  return `<div class="section"><div class="section-h"><h2>${icon("eye",18)}Vue générale</h2><span class="muted">${r.games} dernières parties · repères du rang ${r.rank?esc(r.rank.tierFr):""}</span></div>
    <div class="mgrid">${tiles}</div>
    ${mu?`<p class="muted" style="font-size:13.5px">Matchup le plus difficile : <b style="color:var(--text)">${esc(mu.champ)} contre ${esc(mu.vs)}</b>, ${mu.losses} défaites sur ${mu.games}. <button class="link" data-a="cat" data-v="mu">Travailler les matchups</button></p>`:""}
  </div>`;
}

/* ============================================================
   RENDU & ACTIONS
   ============================================================ */
function render(){
  if(S.profile) document.documentElement.style.setProperty("--tier", T().color);
  switch(V.screen){
    case "ob": return renderOb();
    case "home": return renderHome();
    case "quiz": return renderQuiz();
    case "results": return renderResults();
    case "lesson": return renderLesson();
    case "scenlist": return renderScenList();
    case "scen": return renderScen();
    case "gloss": return renderGloss();
    case "lessons": return renderLessons();
    case "profile": return renderProfile();
    case "link": return renderLink();
  }
}
function act(a, v, el){
  const d = V.ob.data;
  switch(a){
    case "ob-set": d[el.dataset.k] = el.dataset.k==="tier" ? +v : v;
      if(el.dataset.k==="exp"){ delete d.rank; delete d.test; delete d.tier; }
      if(el.dataset.k==="rank"){ delete d.tier; }
      return render();
    case "ob-next": { const steps=obSteps(); if(steps[V.ob.step]==="account" || steps[V.ob.step]==="result") return finishOb(); V.ob.step=Math.min(V.ob.step+1, obSteps().length-1); return render(); }
    case "ob-back": { const steps=obSteps(); if(steps[V.ob.step]==="result"){ delete d.tier; } if(steps[V.ob.step]==="test" && d.test && d.test.i>0 && d.test.i<d.test.items.length){ d.test=null; } V.ob.step=Math.max(0,V.ob.step-1); return render(); }
    case "test-ans": { const t=d.test, q=qById(t.items[t.i]); t.answers.push(+v===0); t.i++; t.order=null; delete d.tier; return render(); }
    case "home": return go("home");
    case "scenlist": return go("scenlist");
    case "gloss": return go("gloss");
    case "lessons": return go("lessons");
    case "profile": V.confirmReset=false; return go("profile");
    case "cat": if(!unlocked(v)){ toast("Valide d’abord l’étape précédente."); return; } return startQuiz(v,"learn");
    case "mix": return startQuiz(null,"learn");
    case "review": return startQuiz(null,"review");
    case "lesson": return go("lesson",{lesson:{cat:v, then:null}});
    case "lesson-go": S.lessons[V.lesson.cat]=true; save(); return go("quiz",{quiz:V.lesson.then});
    case "pick": { const qz=V.quiz; if(qz.phase!=="ask") return; if(T().conf){ qz.pending=+v; render(); } else { clearInterval(tick); grade(qz,+v,"sure"); render(); } return; }
    case "conf": { const qz=V.quiz; if(qz.pending==null) return; grade(qz,qz.pending,v); qz.pending=null; return render(); }
    case "hint": V.quiz.hint=true; return render();
    case "next": { const qz=V.quiz; qz.i++; qz.phase="ask"; qz.sel=null; qz.hint=false; qz.order=null; qz.t0=0; qz.pending=null; if(qz.i>=qz.items.length) return go("results"); return render(); }
    case "quit": return go("home");
    case "again": { const qz=V.quiz; return startQuiz(qz.cat, qz.mode==="review"?"learn":qz.mode); }
    case "scen": return go("scen",{scen:{id:v, pick:null, order:null, t0:0}});
    case "scen-pick": if(V.scen.pick==null) pickScen(+v); return;
    case "scen-retry": return go("scen",{scen:{id:V.scen.id, pick:null, order:null, t0:0}});
    case "scen-next": { const cur=SCENARIOS.find(s=>s.id===V.scen.id), l=scenList().filter(s=>!s.comp===!cur.comp); const i=l.findIndex(s=>s.id===V.scen.id); const n=l[(i+1)%l.length]; return go("scen",{scen:{id:n.id,pick:null,order:null,t0:0}}); }
    case "set-tier": S.profile.tier=+v; save(); toast(`Guidage : ${TIERS[+v].name}`); return render();
    case "set-pace": S.profile.pace=+v; save(); return render();
    case "ob-acct": d.acct=null; return render();
    case "ob-skipacct": d.acct="skip"; d.riot=null; return render();
    case "riot-connect": return connectRiot(v, false);
    case "riot-demo": return connectRiot(v, true);
    case "riot-change": { const st = v==="ob"?d:V.link; st.riot=null; st.err=null; return render(); }
    case "link-riot": if(!USE_RIOT_API){ V.ob={step:1,data:{riotId:""}}; return go("ob"); } V.link={}; return go("link");
    case "link-save": linkRiot(V.link.riot, {riotId:V.link.riotId, platform:V.link.platform}, false); toast("Compte lié. Tes séances sont maintenant ciblées."); return go("home");
    case "riot-refresh": return refreshRiot();
    case "riot-unlink": S.riot=null; save(); toast("Compte délié."); return render();
    case "redo-ob": V.ob={step:0,data:{name:S.profile.name}}; return go("ob");
    case "reset": V.confirmReset=true; return render();
    case "reset-no": V.confirmReset=false; return render();
    case "reset-yes": S=blank(); save(); V.confirmReset=false; V.ob={step:0,data:{}}; return go("ob");
  }
}
document.addEventListener("click", e=>{ const b=e.target.closest("[data-a]"); if(!b || b.disabled) return; act(b.dataset.a, b.dataset.v, b); });
document.addEventListener("keydown", e=>{
  if(V.screen!=="quiz" || e.target.tagName==="INPUT") return;
  const qz=V.quiz; if(!qz) return;
  const k=e.key.toUpperCase(), idx="ABCD".indexOf(k);
  if(qz.phase==="ask" && idx>=0 && qz.order && idx<qz.order.length){ act("pick", String(qz.order[idx])); }
  else if(qz.phase==="ask" && qz.pending!=null && ["1","2","3"].includes(e.key)){ act("conf", ["sure","hesit","guess"][+e.key-1]); }
});
render();
</script>
